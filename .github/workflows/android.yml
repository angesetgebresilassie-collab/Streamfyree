name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle --version
      - name: Build debug APK
        env:
          STREAM_API_BASE: ${{ vars.STREAM_API_BASE }}
        run: |
          if [ -n "$STREAM_API_BASE" ]; then
            gradle clean assembleDebug -PstreamApiBase="$STREAM_API_BASE" --stacktrace --warning-mode all
          else
            gradle clean assembleDebug --stacktrace --info --warning-mode all
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: streamfyree-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
