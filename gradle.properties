org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.workers.max=2
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
googleServices.missing.passthrough=true

# Spotify Web API credentials (Client Credentials flow) for playlist search.
# Get these free at https://developer.spotify.com/dashboard. Leave blank to
# disable the Spotify feed without affecting anything else.
SPOTIFY_CLIENT_ID=
SPOTIFY_CLIENT_SECRET=
