name: Build Streamfyree APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - music-app
      - 'fix-*'
      - 'Rork*'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.10 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Gradle 8.11.1
        run: |
          curl --fail --retry 8 --retry-delay 5 --retry-all-errors -L https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m" -Dfile.encoding=UTF-8
        run: gradle --no-daemon --debug --stacktrace --warning-mode all :app:assembleDebug

      - name: Find APK
        id: apk
        run: |
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Streamfyree-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
