name: Build Streamfyre APK

on:
  workflow_dispatch:
  push:
    branches:
      - music-app
      - fix-playback-error-10424125839107154263

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          check-latest: true

      - name: Verify Python
        run: |
          python --version
          python3.13 --version
          command -v python3.13

      - name: Set up Gradle 8.11.1
        run: |
          curl --fail --retry 8 --retry-delay 5 --retry-all-errors -L https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Verify Android toolchain
        run: |
          java -version
          gradle --version
          echo "AGP: 8.9.2"
          echo "Kotlin: 2.1.20"
          echo "Chaquopy: 17.0.0"
          echo "Android compileSdk: 35"
          echo "Chaquopy Python: 3.13"

      - name: Build debug APK
        # Gradle is installed explicitly because this project intentionally has no wrapper.
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        run: gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Find APK
        id: apk
        run: |
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Streamfyree-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
