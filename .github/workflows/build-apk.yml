name: Build Streamfyree APK

on:
  workflow_dispatch:
  push:
    branches:
      - music-app

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Chaquopy supplies the Python runtime embedded in the Android app.
      # Host Python validates the bundled Python bridge.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install workflow Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "yt-dlp==2026.08.19"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify toolchain
        run: |
          java -version
          python --version
          gradle --version
          echo "AGP: 8.9.2"
          echo "Kotlin: 2.1.20"
          echo "Chaquopy: 17.0.0"
          echo "Android compileSdk: 35"
          echo "Embedded Python: 3.13"
          echo "Embedded yt-dlp: 2026.08.19"

      - name: Validate Python bridge
        run: |
          python -m py_compile app/src/main/python/ytbridge.py
          python -c "import yt_dlp; print('yt-dlp:', yt_dlp.version.__version__)"

      - name: Build debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        run: |
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Find APK
        id: apk
        run: |
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Streamfyree-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
