name: Extract uploaded project

on:
  push:
    branches: [music-app]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP"
          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -q "$ZIP" -d /tmp/project
          ROOT="$(find /tmp/project -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT"
          cp -a "$ROOT"/. .
          rm -f "$ZIP"
          rm -f .github/workflows/extract-uploaded-project.yml

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract uploaded project into music-app branch" || exit 0
          git push
